<!doctype html><html lang="ko"><meta charset="UTF-8"><title>unfclip media integration</title><style>body{font:18px system-ui;max-width:900px;margin:30px auto;padding:15px}button{font-size:20px;padding:15px}video{width:200px}pre{white-space:pre-wrap}</style><h1>브라우저 미디어 검증</h1><button id="run">통합 검증 실행</button><pre id="results">대기</pre><video controls playsinline></video><script type="module">
import {loadFile,analyze,renderVideo,draw,sourceAt,followMask} from '../src/media.js';import {defaults} from '../src/core.mjs';import {Input,BlobSource,ALL_FORMATS,Output,BufferTarget,Mp4OutputFormat,CanvasSource,AudioBufferSource} from 'mediabunny';
const out=document.querySelector('pre');const write=s=>out.textContent+='\n'+s;const assert=(v,s)=>{if(!v)throw Error(s);write('PASS '+s)};
document.querySelector('button').onclick=async()=>{out.textContent='실행 중';try{let data=await (await fetch('./fixtures/face.jpg')).blob();const photo=await loadFile(new File([data],'face.jpg',{type:'image/jpeg'}));photo.auto=await analyze(photo,()=>{});assert(photo.auto[0].boxes.length>0,'사진 얼굴 검출');photo.analyzed=true;photo.masks=[{id:'manual',from:0,to:60,points:[{t:0,x:.1,y:.7,w:.2,h:.1}]}];const canvas=document.createElement('canvas');canvas.width=360;canvas.height=640;draw(canvas,photo.image,photo,defaults(),0);const a=canvas.getContext('2d').getImageData(0,0,360,640).data;draw(canvas,photo.image,photo,defaults(),10);const b=canvas.getContext('2d').getImageData(0,0,360,640).data;assert(a.every((v,i)=>v===b[i]),'사진 수동 가림이 5초 이후에도 유지');
const target=new BufferTarget(),sourceCanvas=document.createElement('canvas');sourceCanvas.width=360;sourceCanvas.height=640;const output=new Output({format:new Mp4OutputFormat(),target});const video=new CanvasSource(sourceCanvas,{codec:'avc',bitrate:700000}),audio=new AudioBufferSource({codec:'aac',bitrate:96000});output.addVideoTrack(video,{frameRate:24});output.addAudioTrack(audio);await output.start();const ctx=sourceCanvas.getContext('2d');for(let i=0;i<72;i++){ctx.fillStyle='#123';ctx.fillRect(0,0,360,640);ctx.drawImage(photo.image,20+i,50,220,275);await video.add(i/24,1/24)}const sound=new AudioBuffer({length:44100*3,numberOfChannels:2,sampleRate:44100});for(let ch=0;ch<2;ch++)for(let i=0;i<sound.length;i++)sound.getChannelData(ch)[i]=.03*Math.sin(i/44100*440*2*Math.PI);await audio.add(sound);video.close();audio.close();await output.finalize();const moving=await loadFile(new File([target.buffer],'moving.mp4',{type:'video/mp4'}));moving.auto=await analyze(moving,()=>{});moving.analyzed=true;assert(moving.auto.length>=18,'영상 시간별 얼굴 분석');assert(moving.auto.some(f=>f.boxes.length),'움직이는 얼굴 검출');const first=moving.auto.find(f=>f.boxes.length);const track=followMask(moving,{points:[{...first.boxes[0],t:first.t}]});assert(track.points.length>1,'수동 선택 얼굴 위치 추적');
const external=await loadFile(new File([await (await fetch('./fixtures/video.mp4')).blob()],'video.mp4',{type:'video/mp4'}));external.auto=await analyze(external,()=>{});external.analyzed=true;const settings={...defaults(),org:'검증기관',activity:'통합 테스트',phone:'031-123-4567',quality:720,duration:10,originalAudio:true,music:'calm'};const result=await renderVideo([photo,moving,external],settings,()=>{},new AbortController().signal);assert(result.poster?.startsWith('data:image/jpeg'),'가림 적용 첫 장면 표지 생성');document.querySelector('video').poster=result.poster;document.querySelector('video').src=URL.createObjectURL(result.blob);const input=new Input({source:new BlobSource(result.blob),formats:ALL_FORMATS});const vt=await input.getPrimaryVideoTrack(),at=await input.getPrimaryAudioTrack();assert(vt.displayWidth===720&&vt.displayHeight===1280,'최종 MP4 9:16 해상도');assert(at&&await at.canDecode(),'원본 소리 AAC 트랙');assert(Math.abs(await input.computeDuration()-result.duration)<.15,'영상과 오디오 길이 일치');assert(result.blob.size>10000,'실제 MP4 파일 생성');write('ALL PASSED');}catch(e){write('FAIL '+e.stack)}};
</script></html>
